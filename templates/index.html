{% extends "base.html" %}
{% block title %}AI Code Review - 代码评审工具{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm border-0">
            <div class="card-body p-5 text-center">
                <i class="bi bi-robot display-1 text-primary mb-3"></i>
                <h2 class="mb-2">AI 代码评审工具</h2>
                <p class="text-muted mb-4">输入 GitHub Pull Request 链接，自动生成 AI 代码评审报告</p>

                <form id="reviewForm" class="mt-4">
                    <div class="input-group input-group-lg mb-3">
                        <span class="input-group-text bg-white"><i class="bi bi-github"></i></span>
                        <input type="url" class="form-control" id="prUrl"
                               placeholder="https://github.com/owner/repo/pull/123"
                               required>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <div class="form-check text-start">
                                <input class="form-check-input" type="checkbox" id="autoComment">
                                <label class="form-check-label" for="autoComment">
                                    自动评论到 GitHub PR
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <input type="password" class="form-control" id="githubToken"
                                   placeholder="GitHub Token (可选，不传则使用全局配置)">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg px-5" id="submitBtn">
                        <i class="bi bi-play-fill"></i> 开始评审
                    </button>
                </form>
            </div>
        </div>

        <div class="card shadow-sm border-0 mt-4 d-none" id="resultCard">
            <div class="card-body text-center p-4">
                <div class="spinner-border text-primary mb-3" role="status" id="loadingSpinner">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <h5 id="resultTitle">任务已创建</h5>
                <p class="text-muted mb-2" id="resultStatus">正在获取 PR 信息...</p>
                <div class="progress mb-3 d-none" id="progressBar" style="height: 8px;">
                    <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" id="progressBarFill"></div>
                </div>
                <a href="#" id="viewReportLink" class="btn btn-success d-none">
                    <i class="bi bi-file-text"></i> 查看评审报告
                </a>
                <p class="mt-2 mb-0">
                    <a href="#" id="taskLink" class="text-decoration-none">查看任务进度</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.getElementById('reviewForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> 提交中...';

    try {
        const resp = await fetch('/api/tasks', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                pr_url: document.getElementById('prUrl').value,
                github_token: document.getElementById('githubToken').value || null,
                auto_comment: document.getElementById('autoComment').checked
            })
        });

        if (!resp.ok) {
            const err = await resp.json();
            alert('创建任务失败: ' + (err.detail || '未知错误'));
            return;
        }

        const data = await resp.json();
        const taskLink = document.getElementById('taskLink');
        taskLink.href = `/tasks/${data.task_id}`;
        taskLink.textContent = `查看任务 #${data.task_id} 进度`;

        document.getElementById('resultCard').classList.remove('d-none');
        document.getElementById('viewReportLink').classList.add('d-none');

        // Start polling
        pollTask(data.task_id);
    } catch (err) {
        alert('网络错误: ' + err.message);
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-play-fill"></i> 开始评审';
    }
});

async function pollTask(taskId) {
    const statusEl = document.getElementById('resultStatus');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressBarFill');
    const spinner = document.getElementById('loadingSpinner');
    const viewReportLink = document.getElementById('viewReportLink');

    const interval = setInterval(async () => {
        try {
            const resp = await fetch(`/api/tasks/${taskId}`);
            const data = await resp.json();

            statusEl.textContent = `状态: ${data.status}`;
            progressBar.classList.remove('d-none');
            progressFill.style.width = (data.progress || 0) + '%';

            if (data.status === 'DONE') {
                clearInterval(interval);
                spinner.classList.remove('active');
                spinner.classList.add('d-none');
                statusEl.textContent = '✅ 评审完成！';
                progressFill.classList.remove('progress-bar-animated');
                viewReportLink.href = `/tasks/${taskId}/report`;
                viewReportLink.classList.remove('d-none');
            } else if (data.status === 'FAILED') {
                clearInterval(interval);
                spinner.classList.remove('active');
                spinner.classList.add('d-none');
                statusEl.textContent = '❌ 评审失败';
                progressFill.classList.remove('progress-bar-animated');
            }
        } catch (e) {
            console.error('Poll error:', e);
        }
    }, 2000);
}
</script>
{% endblock %}
