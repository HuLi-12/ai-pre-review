<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Code Review{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f5f7fb; font-family: -apple-system, 'Segoe UI', sans-serif; }
        .navbar-brand { font-weight: 600; }
        .severity-critical { color: #dc3545; }
        .severity-high { color: #fd7e14; }
        .severity-medium { color: #ffc107; }
        .severity-low { color: #6c757d; }
        .badge-critical { background: #dc3545; }
        .badge-high { background: #fd7e14; }
        .badge-medium { background: #ffc107; color: #000; }
        .badge-low { background: #6c757d; }
        .finding-item { border-left: 3px solid transparent; }
        .finding-item.critical { border-left-color: #dc3545; }
        .finding-item.high { border-left-color: #fd7e14; }
        .finding-item.medium { border-left-color: #ffc107; }
        .finding-item.low { border-left-color: #6c757d; }
        .code-block { background: #1e1e1e; color: #d4d4d4; border-radius: 6px; padding: 12px; font-size: 13px; overflow-x: auto; font-family: 'JetBrains Mono', 'Fira Code', monospace; }
        .diff-add { background: #2d4a2d; }
        .diff-del { background: #4a2d2d; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-code-square"></i> AI Code Review
            </a>
        </div>
    </nav>

    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
